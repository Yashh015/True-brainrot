<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 8px; font: 13px system-ui; background: #111; color: #eee }
  button { background: #222; color: #eee; border: 0; padding: 4px 10px; border-radius: 4px; cursor: pointer }
  #banner { display: none; gap: 8px; align-items: center }
  #gap { flex: 1 }
</style>
<button onclick="companion.tab('x')">X</button>
<button onclick="companion.tab('instagram')">Instagram</button>
<span id="gap"></span>
<span id="banner"><span id="text"></span><button onclick="companion.snooze()">5 more s</button></span>
<button onclick="companion.minimise()" title="Hide till Claude's next long task">–</button>
<button onclick="companion.quit()" title="Quit">×</button>
<script>
  const ctx = new AudioContext()

  // Soft rising pair for done, sharp repeated beep for needs-you, so you know whether to hurry.
  function chime(kind) {
    const sharp = kind === 'attention'
    const notes = sharp ? [880, 880] : [660, 990]
    notes.forEach((freq, i) => {
      const at = ctx.currentTime + i * 0.18
      const osc = ctx.createOscillator()
      const gain = ctx.createGain()
      osc.type = sharp ? 'square' : 'sine'
      osc.frequency.value = freq
      gain.gain.setValueAtTime(0.15, at)
      gain.gain.exponentialRampToValueAtTime(0.001, at + 0.16)
      osc.connect(gain).connect(ctx.destination)
      osc.start(at)
      osc.stop(at + 0.17)
    })
  }

  companion.onAlert(kind => {
    banner.style.display = kind ? 'flex' : 'none'
    if (!kind) return
    text.textContent = kind === 'attention' ? 'Claude needs you' : "Claude's done"
    chime(kind)
  })
</script>
