<!doctype html>
<meta charset="utf-8">
<style>
  /* Taken from Claude desktop's panes, so the panel reads as one more of them. */
  :root { --bg: #1f1f1f; --line: #333; --text: #e5e5e5; --muted: #9b9b9b; --hover: #2c2c2c; --active: #383838 }
  html, body { margin: 0; height: 100% }
  /* The border round the whole window; main.js insets the feed by the same 1 px. */
  body { box-sizing: border-box; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: 14px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif }
  header { height: 43px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 10px; border-bottom: 1px solid var(--line) }
  button { display: grid; place-items: center; height: 30px; min-width: 30px; padding: 0 10px; border: 0; border-radius: 7px; background: none; color: var(--muted); font: inherit; cursor: pointer }
  button:hover { background: var(--hover); color: var(--text) }
  button.on { background: var(--active); color: var(--text) }
  button.icon { padding: 0; width: 32px }
  #gap { flex: 1 }
  [hidden] { display: none !important } /* button's display: grid would otherwise beat the hidden attribute */
  #banner { display: none; align-items: center; gap: 6px; margin-right: 4px; padding-left: 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--text) }
  #banner.attention { border-color: #b4552d }
  #banner button { height: 26px; padding: 0 8px }
  /* The gate: shown under the bar, in place of the feed, while the account doesn't allow it. */
  #gate { padding: 40px 28px; display: grid; gap: 14px; max-width: 360px; margin: 0 auto }
  #gate h1 { margin: 0; font-size: 20px; font-weight: 600 }
  #gate p { margin: 0; color: var(--muted); line-height: 1.5 }
  #gate input { height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--hover); color: var(--text); font: inherit }
  #gate .primary { height: 36px; background: var(--text); color: var(--bg); font-weight: 600 }
  #gate .primary:hover { background: #fff }
  #gate .device { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px }
  #gate .error { color: #e2795a }
  body.locked [data-tab], body.locked #zoom { display: none !important }
</style>
<header>
  <button data-tab="x" class="on icon" title="X" aria-label="X">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>
  </button>
  <button data-tab="instagram" class="icon" title="Instagram" aria-label="Instagram">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.0301.084c-1.2768.0602-2.1487.264-2.911.5634-.7888.3075-1.4575.72-2.1228 1.3877-.6652.6677-1.075 1.3368-1.3802 2.127-.2954.7638-.4956 1.6365-.552 2.914-.0564 1.2775-.0689 1.6882-.0626 4.947.0062 3.2586.0206 3.6671.0825 4.9473.061 1.2765.264 2.1482.5635 2.9107.308.7889.72 1.4573 1.388 2.1228.6679.6655 1.3365 1.0743 2.1285 1.38.7632.295 1.6361.4961 2.9134.552 1.2773.056 1.6884.069 4.9462.0627 3.2578-.0062 3.668-.0207 4.9478-.0814 1.28-.0607 2.147-.2652 2.9098-.5633.7889-.3086 1.4578-.72 2.1228-1.3881.665-.6682 1.0745-1.3378 1.3795-2.1284.2957-.7632.4966-1.636.552-2.9124.056-1.2809.0692-1.6898.063-4.948-.0063-3.2583-.021-3.6668-.0817-4.9465-.0607-1.2797-.264-2.1487-.5633-2.9117-.3084-.7889-.72-1.4568-1.3876-2.1228C21.2982 1.33 20.628.9208 19.8378.6165 19.074.321 18.2017.1197 16.9244.0645 15.6471.0093 15.236-.005 11.977.0014 8.718.0076 8.31.0215 7.0301.0839m.1402 21.6932c-1.17-.0509-1.8053-.2453-2.2287-.408-.5606-.216-.96-.4771-1.3819-.895-.422-.4178-.6811-.8186-.9-1.378-.1644-.4234-.3624-1.058-.4171-2.228-.0595-1.2645-.072-1.6442-.079-4.848-.007-3.2037.0053-3.583.0607-4.848.05-1.169.2456-1.805.408-2.2282.216-.5613.4762-.96.895-1.3816.4188-.4217.8184-.6814 1.3783-.9003.423-.1651 1.0575-.3614 2.227-.4171 1.2655-.06 1.6447-.072 4.848-.079 3.2033-.007 3.5835.005 4.8495.0608 1.169.0508 1.8053.2445 2.228.408.5608.216.96.4754 1.3816.895.4217.4194.6816.8176.9005 1.3787.1653.4217.3617 1.056.4169 2.2263.0602 1.2655.0739 1.645.0796 4.848.0058 3.203-.0055 3.5834-.061 4.848-.051 1.17-.245 1.8055-.408 2.2294-.216.5604-.4763.96-.8954 1.3814-.419.4215-.8181.6811-1.3783.9-.4224.1649-1.0577.3617-2.2262.4174-1.2656.0595-1.6448.072-4.8493.079-3.2045.007-3.5825-.006-4.848-.0608M16.953 5.5864A1.44 1.44 0 1 0 18.39 4.144a1.44 1.44 0 0 0-1.437 1.4424M5.8385 12.012c.0067 3.4032 2.7706 6.1557 6.173 6.1493 3.4026-.0065 6.157-2.7701 6.1506-6.1733-.0065-3.4032-2.771-6.1565-6.174-6.1498-3.403.0067-6.156 2.771-6.1496 6.1738M8 12.0077a4 4 0 1 1 4.008 3.9921A3.9996 3.9996 0 0 1 8 12.0077"/></svg>
  </button>
  <span id="gap"></span>
  <span id="banner"><span id="text"></span><button onclick="companion.snooze()">5 more s</button></span>
  <button id="zoom" onclick="companion.zoomReset()" title="Reset zoom (Ctrl+0)" hidden></button>
  <button class="icon" onclick="companion.minimise()" title="Hide till Claude's next long task">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3.5 8h9"/></svg>
  </button>
  <button class="icon" onclick="companion.quit()" title="Quit">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 4l8 8M12 4l-8 8"/></svg>
  </button>
</header>
<main id="gate" hidden></main>
<script>
  // Every screen is built from text nodes, never HTML strings: device names come from the server.
  const el = (tag, props = {}, ...kids) => {
    const node = Object.assign(document.createElement(tag), props)
    node.append(...kids)
    return node
  }
  const button = (text, onclick, primary) => el('button', { textContent: text, onclick, className: primary ? 'primary' : '' })

  const screens = {
    'signed-out': view => view.sent
      ? [el('h1', { textContent: 'Check your email' }),
         el('p', { textContent: `We sent a sign-in link to ${view.sent}. Open it on this PC.` }),
         button('Use a different email', () => companion.signOut())]
      : [el('h1', { textContent: 'Sign in to True Brainrot' }),
         el('p', { textContent: 'Your 7-day free trial starts when you sign in. No card needed.' }),
         el('form', { onsubmit: event => { event.preventDefault(); companion.signIn(event.target.email.value) } },
           el('input', { name: 'email', type: 'email', required: true, placeholder: 'you@example.com', autocomplete: 'email', style: 'width:100%;box-sizing:border-box;margin-bottom:10px' }),
           el('button', { type: 'submit', textContent: 'Email me a sign-in link', className: 'primary', style: 'width:100%' }))],
    'trial-ended': () => [el('h1', { textContent: 'Your free trial has ended' }),
      el('p', { textContent: 'Subscribe to keep scrolling while Claude works.' }), button('Subscribe', () => companion.subscribe(), true)],
    'cancelled': () => [el('h1', { textContent: 'Your subscription has ended' }),
      el('p', { textContent: 'Subscribe again to bring the feed back.' }), button('Subscribe', () => companion.subscribe(), true)],
    'payment-failed': () => [el('h1', { textContent: 'Your last payment didn\'t go through' }),
      el('p', { textContent: 'Update your payment details to keep the feed.' }), button('Update payment', () => companion.subscribe(), true)],
    'offline-too-long': () => [el('h1', { textContent: 'Connect to the internet' }),
      el('p', { textContent: 'True Brainrot checks your subscription every few days.' }), button('Try again', () => companion.refresh(), true)],
    'device-limit': view => [el('h1', { textContent: 'Signed in on 2 PCs already' }),
      el('p', { textContent: 'Sign out one of them to use True Brainrot here.' }),
      ...view.devices.map(d => el('div', { className: 'device' }, el('span', { textContent: d.name }), button('Sign out that PC', () => companion.removeDevice(d.device_id))))],
  }

  // Re-built only when something changed, so a half-typed email survives the minute-by-minute check.
  let shownGate = ''
  companion.onAccess(view => {
    document.body.classList.toggle('locked', !view.ok)
    gate.hidden = view.ok
    const key = JSON.stringify([view.reason, view.sent, view.error, view.devices])
    if (view.ok || key === shownGate) return
    shownGate = key
    gate.replaceChildren(...screens[view.reason](view), ...(view.error ? [el('p', { className: 'error', textContent: view.error })] : []))
  })

  const tabs = document.querySelectorAll('[data-tab]')
  tabs.forEach(b => b.onclick = () => {
    tabs.forEach(t => t.classList.toggle('on', t === b))
    companion.tab(b.dataset.tab)
  })

  // Like Chrome's zoom badge: only there when the page isn't at 100%, and a click puts it back.
  companion.onZoom(factor => {
    zoom.hidden = factor === 1
    zoom.textContent = Math.round(factor * 100) + '%'
  })

  const ctx = new AudioContext()

  // Soft rising pair for done, sharp repeated beep for needs-you, so you know whether to hurry.
  function chime(kind) {
    const sharp = kind === 'attention'
    const notes = sharp ? [880, 880] : [660, 990]
    notes.forEach((freq, i) => {
      const at = ctx.currentTime + i * 0.18
      const osc = ctx.createOscillator()
      const gain = ctx.createGain()
      osc.type = sharp ? 'square' : 'sine'
      osc.frequency.value = freq
      gain.gain.setValueAtTime(0.15, at)
      gain.gain.exponentialRampToValueAtTime(0.001, at + 0.16)
      osc.connect(gain).connect(ctx.destination)
      osc.start(at)
      osc.stop(at + 0.17)
    })
  }

  companion.onAlert(kind => {
    banner.style.display = kind ? 'flex' : 'none'
    if (!kind) return
    banner.classList.toggle('attention', kind === 'attention')
    text.textContent = kind === 'attention' ? 'Claude needs you' : "Claude's done"
    chime(kind)
  })
</script>
